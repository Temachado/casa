<style>
/* Layout: cabeçalho fixo com mês e "quem lança"; painel com cartões no topo, contas editáveis no meio, gráficos embaixo */
:root{
  --bg:#f4f5fa; --surface:#ffffff; --surface2:#eef0f8; --ink:#1a1c2b; --muted:#5f6582; --line:#e1e4f0;
  --accent:#f2542d; --accent-ink:#ffffff; --cobalt:#3a56d4;
  --ok:#14945f; --ok-bg:#dcf5e9; --warn:#b86a00; --warn-bg:#fff0d6; --bad:#c9302c; --bad-bg:#fde3e1;
  --c1:#3a56d4; --c2:#0f9aa8; --c3:#2fa84f; --c4:#f2542d; --c5:#e0a100; --c6:#e0457b; --c7:#8a4fd8; --c8:#c2389e; --c9:#1d8fe0; --c10:#7d8597; --c11:#b5651d;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12131c; --surface:#1b1d2a; --surface2:#24273a; --ink:#eef0fa; --muted:#a2a8c4; --line:#2f3347;
  --accent:#ff6a45; --accent-ink:#1a0d08; --cobalt:#7d93ff;
  --ok:#4fd39a; --ok-bg:#163527; --warn:#ffbf55; --warn-bg:#3a2c12; --bad:#ff7b75; --bad-bg:#3d1c1b;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#12131c; --surface:#1b1d2a; --surface2:#24273a; --ink:#eef0fa; --muted:#a2a8c4; --line:#2f3347;
  --accent:#ff6a45; --accent-ink:#1a0d08; --cobalt:#7d93ff;
  --ok:#4fd39a; --ok-bg:#163527; --warn:#ffbf55; --warn-bg:#3a2c12; --bad:#ff7b75; --bad-bg:#3d1c1b;
  color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1120px;margin:0 auto;display:grid;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(1.5rem,4vw,2.1rem);font-weight:800}
h2{font-size:1.15rem;font-weight:700}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:grid;gap:12px;border-bottom:1px solid var(--line)}
.toprow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:11px;background:conic-gradient(var(--c1) 0 25%,var(--c3) 0 50%,var(--c5) 0 75%,var(--accent) 0);display:grid;place-items:center}
.logo::after{content:"";width:16px;height:16px;border-radius:50%;background:var(--bg)}
.month{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.month button{border:0;background:transparent;width:34px;height:34px;border-radius:50%;font-size:18px}
.month button:hover{background:var(--surface2)}
.month span{min-width:140px;text-align:center;font-weight:700}
.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.who small{color:var(--muted);font-weight:600}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:transparent;padding:8px 14px;border-radius:10px;font-weight:600;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.btn{border:0;border-radius:11px;padding:10px 16px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.small{padding:6px 11px;font-size:.85rem;border-radius:9px}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn.link{background:none;color:var(--cobalt);padding:6px 4px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon{border:0;background:var(--surface);color:var(--ink);width:32px;height:32px;border-radius:9px;font-size:15px;display:inline-grid;place-items:center;border:1px solid var(--line)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.cardhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.cardhead p{margin:0;color:var(--muted);font-size:.88rem}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{border-radius:var(--r);padding:16px;color:#fff;display:grid;gap:4px;min-width:0}
.kpi .lbl{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700;opacity:.9}
.kpi .val{font-family:var(--display);font-size:clamp(1.25rem,3vw,1.75rem);font-weight:800}
.kpi .sub{font-size:.85rem;opacity:.92}
.k1{background:linear-gradient(135deg,#3a56d4,#5b3fc4)} .k2{background:linear-gradient(135deg,#13895a,#2fa84f)}
.k3{background:linear-gradient(135deg,#e2511f,#f28a2d)} .k4{background:linear-gradient(135deg,#c2389e,#e0457b)}
.grid2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px}

/* cartões */
.wallet{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.cc{position:relative;aspect-ratio:1.6;max-width:100%;border-radius:16px;padding:14px 16px;color:#fff;display:grid;grid-template-rows:auto 1fr auto;text-align:left;border:0;overflow:hidden;box-shadow:0 6px 18px -8px rgba(10,12,30,.55);transition:transform .15s}
.cc::after{content:"";position:absolute;width:150px;height:150px;border-radius:50%;right:-45px;top:-55px;background:rgba(255,255,255,.12)}
.cc:hover{transform:translateY(-2px)}
.cc[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:3px}
.cc .cn{font-weight:700;font-size:.95rem;position:relative;z-index:1;padding-right:34px}
.cc .ct{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;opacity:.85;position:relative;z-index:1}
.cc .cv{font-family:var(--display);font-size:1.45rem;font-weight:800;align-self:end;position:relative;z-index:1}
.cc .cs{font-size:.78rem;opacity:.9;display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:1}
.cc .chipgold{position:absolute;left:16px;top:52%;width:30px;height:22px;border-radius:5px;background:linear-gradient(135deg,#f7d97a,#c9a13b);opacity:.85}
.edit{position:absolute;right:10px;top:10px;z-index:2;width:30px;height:30px;border-radius:9px;border:0;background:rgba(255,255,255,.2);color:#fff;font-size:14px}
.cc.other{background:var(--surface2);color:var(--ink);box-shadow:none;border:1.5px solid var(--line)}
.cc.other::after{background:var(--line)}
.cc.add{background:transparent;color:var(--muted);border:2px dashed var(--line);box-shadow:none;place-items:center;grid-template-rows:1fr;font-weight:700}
.cc.add::after{display:none}

/* gráficos */
.donutwrap{display:grid;grid-template-columns:180px minmax(0,1fr);gap:18px;align-items:center}
.legend{display:grid;gap:7px}
.legrow{display:grid;grid-template-columns:12px minmax(0,1fr) auto auto;gap:8px;align-items:center;font-size:.9rem;border:0;background:none;padding:0;text-align:left}
.dot{width:12px;height:12px;border-radius:4px}
.legrow .pct{color:var(--muted);font-size:.8rem;min-width:38px;text-align:right}
.bars{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;align-items:end;height:170px;padding-top:10px}
.bar{display:grid;gap:6px;justify-items:center;align-content:end;height:100%}
.bar .b{width:100%;max-width:46px;border-radius:9px 9px 4px 4px;background:var(--surface2);min-height:4px}
.bar.cur .b{background:linear-gradient(180deg,var(--accent),#f28a2d)}
.bar .v{font-size:.72rem;color:var(--muted)}
.bar .m{font-size:.8rem;font-weight:700}

.list{display:grid;gap:8px}
.row{display:grid;grid-template-columns:6px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--surface2)}
.row .stripe{width:6px;height:100%;min-height:34px;border-radius:4px}
.row .t{font-weight:700;overflow-wrap:anywhere}
.row .s{font-size:.82rem;color:var(--muted);overflow-wrap:anywhere}
.row .right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.row.click{cursor:pointer}
.row.click:hover{outline:1.5px solid var(--line)}
.pill{font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.auto{background:var(--surface);color:var(--cobalt);border:1px solid var(--line)}
.empty{color:var(--muted);text-align:center;padding:22px 10px;border:1.5px dashed var(--line);border-radius:12px}
.inline{border:1.5px solid var(--cobalt);background:var(--surface);border-radius:12px;padding:14px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.inline .f.wide{grid-column:span 2}
.inline .actions{grid-column:1/-1}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:.9rem;min-width:720px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);background:var(--surface2)}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface2)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.filters input,.filters select{padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}

.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.f{display:grid;gap:6px;min-width:0;align-content:start}
.f.full{grid-column:1/-1}
.f label,.f .lab{font-size:.82rem;font-weight:700;color:var(--muted)}
.f input,.f select,.f textarea{padding:10px 12px;border-radius:11px;border:1.5px solid var(--line);background:var(--surface);width:100%}
.f input:focus,.f select:focus{border-color:var(--cobalt);outline:none}
.check{display:flex;align-items:center;gap:10px;font-weight:600;padding:10px 12px;border-radius:11px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--cobalt)}
.payopts{display:flex;flex-wrap:wrap;gap:8px}
.payopt{border:1.5px solid var(--line);background:var(--surface);border-radius:11px;padding:8px 12px;font-weight:600;display:flex;align-items:center;gap:8px;font-size:.9rem}
.payopt i{width:22px;height:15px;border-radius:4px;display:inline-block}
.payopt[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600}
.seg button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:34px;height:24px;border-radius:6px;border:2px solid transparent}
.sw[aria-pressed="true"]{border-color:var(--ink);outline:2px solid var(--surface);outline-offset:-4px}
.actions{display:flex;gap:10px;flex-wrap:wrap;grid-column:1/-1}
.err{color:var(--bad);font-weight:600;font-size:.9rem;grid-column:1/-1}

.banner{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:12px 14px;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
.exp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.exp button{display:grid;gap:3px;text-align:left;border:1.5px solid var(--line);background:var(--surface2);border-radius:12px;padding:12px}
.exp b{font-family:var(--display);font-size:1.05rem}
.exp span{font-size:.82rem;color:var(--muted)}
.muted{color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:.82rem}
.tag i{width:9px;height:9px;border-radius:3px;display:inline-block}

.group{background:var(--surface2);border-radius:12px;overflow:hidden}
.group.open{box-shadow:inset 0 0 0 1.5px var(--line)}
.group>.row{background:transparent;cursor:pointer}
.chev{width:22px;text-align:center;color:var(--muted);font-size:14px}
.sub{padding:0 12px 12px;display:grid;gap:10px}
.sub .row{background:var(--surface)}
.subtabs{display:flex;gap:4px;background:var(--surface);padding:4px;border-radius:11px;border:1px solid var(--line);justify-self:start}
.subtabs button{border:0;background:transparent;padding:7px 16px;border-radius:8px;font-weight:700;color:var(--muted)}
.subtabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.subtabs .cnt{font-weight:600;opacity:.75;font-size:.8rem}
.addbig{width:100%;border:2px dashed var(--line);background:transparent;border-radius:var(--r);padding:18px;font-weight:700;font-size:1rem;color:var(--cobalt)}
.addbig:hover{background:var(--surface)}

/* GitHub: login e aviso de versão */
body.locked .top,body.locked #main,body.locked .tabs{display:none!important}
.loginwrap{min-height:80vh;display:grid;place-items:center}
.logincard{width:min(380px,100%);display:grid;gap:14px}
.logincard input{padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:16px;width:100%}
.logincard input:focus{border-color:var(--cobalt);outline:none}
.logincard label{font-size:.85rem;font-weight:700;color:var(--muted)}
.upd{position:fixed;left:0;right:0;top:0;z-index:30;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;
  background:#14945f;color:#fff;font-weight:700;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.upd button{border:0;border-radius:10px;padding:8px 14px;font-weight:800;background:#fff;color:#14945f}
.falta{color:var(--bad);font-weight:800}
.plist .row .s{display:none}
.plist .row .t{text-transform:uppercase;letter-spacing:.02em}
.plist .row .t .pill{text-transform:none;letter-spacing:0}
.plist .row .stripe{min-height:22px}
.confirma{font-weight:700;align-self:center;margin-right:2px}
.fimlista{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.fimlista .inline{flex:1 1 100%}
.subtabs{flex-wrap:wrap;max-width:100%}
.row .t .pill{vertical-align:2px;margin-left:4px}

/* lançamento rápido */
body[data-aba="rapido"] .top .month,body[data-aba="rapido"] .top .who{display:none}
.rap{display:grid;gap:14px;border:1.5px solid var(--ink)}
.rap .who{gap:6px}
.rapform{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}
.raptxt{font-family:var(--display);font-size:1.5rem;font-weight:700;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--surface2);width:100%;min-width:0}
.raptxt::placeholder{color:var(--muted);font-weight:500}
.raptxt:focus{border-color:var(--accent);outline:none;background:var(--surface)}
.rapform .btn{font-size:1.05rem;padding:0 22px}
.prev{display:grid;gap:12px;padding:12px;border-radius:12px;background:var(--surface2)}
.prev .row{background:var(--surface)}
.prevf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.prevf .f select{padding:8px 10px}
.prevf .f select.falta{border-color:var(--warn);background:var(--warn-bg)}
.fonte{font-size:.75rem;font-weight:600;color:var(--muted)}
.rapex{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.85rem;color:var(--muted)}
.rapex button{border:1px dashed var(--line);background:transparent;border-radius:999px;padding:4px 10px;font-size:.85rem;color:var(--ink)}
.feito{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:12px;background:var(--ok-bg);color:var(--ok);font-weight:600}
.feito div{display:flex;gap:6px;flex-wrap:wrap}
.rapnav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.rapnav .addbig{padding:14px}
@media (max-width:520px){.prevf,.rapnav{grid-template-columns:minmax(0,1fr)}.raptxt{font-size:1.25rem}.rapform .btn{padding:0 16px}}
@media (max-width:640px){h1{font-size:1.35rem}.toprow{gap:10px}.month{width:100%;justify-content:space-between}.who{width:100%}
  .row{grid-template-columns:6px minmax(0,1fr);row-gap:8px}.row .stripe{grid-row:span 2}.row .right{grid-column:2;justify-content:flex-start}
  .group>.row .right{justify-content:space-between}}
@media (max-width:860px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:minmax(0,1fr)}.inline{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.donutwrap{grid-template-columns:minmax(0,1fr);justify-items:center}.legend{width:100%}.form,.inline{grid-template-columns:minmax(0,1fr)}.inline .f.wide{grid-column:auto}.exp{grid-template-columns:minmax(0,1fr)}.month span{min-width:120px}.wallet{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}.cc .cv{font-size:1.15rem}}

/* celular: menu fixo embaixo, nada passa da largura da tela */
html,body{overflow-x:clip}
.tabs svg,.tabs .sm,.mlist{display:none}
@media (max-width:640px){
  input,select,textarea{font-size:16px}
  body{padding-bottom:calc(78px + env(safe-area-inset-bottom,0px))}
  .wrap{gap:12px}
  .top{position:static;padding-block:10px 8px;gap:8px}
  h1{font-size:1.2rem}
  .logo{width:30px;height:30px;border-radius:9px}
  .logo::after{width:12px;height:12px}
  .month button{width:30px;height:30px}
  .chip{padding:5px 11px}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px;overflow:visible;
    background:var(--surface);border-top:1px solid var(--line);

<script>
const PESSOAS=["Pai","Mãe","Filha"];
const CATS=[["Moradia","--c1"],["Contas da casa","--c2"],["Mercado","--c3"],["Delivery","--c4"],["Transporte","--c5"],["Saúde","--c6"],["Educação","--c7"],["Lazer","--c8"],["Assinaturas","--c9"],["Impostos","--c11"],["Outros","--c10"]];
const OUTROS=["Pix","Boleto","Débito em conta","Dinheiro","Transferência","Vários"];
const CORES={btg:["#0b2a5b","#2554a8"],btg2:["#16213a","#47618f"],santander:["#a80d09","#ec2d1d"],santander2:["#5e0a07","#b4231a"],roxo:["#4c1d95","#8b5cf6"],verde:["#065f46","#10b981"],preto:["#111827","#4b5563"],laranja:["#b4400c","#fb923c"]};
const MESES=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const catColor=c=>{const f=CATS.find(x=>x[0]===c);return `var(${f?f[1]:"--c10"})`;};
const ccBg=k=>{const c=CORES[k]||CORES.preto;return `linear-gradient(135deg,${c[0]},${c[1]})`;};
const brl=v=>(Number(v)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hoje=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;};
const mesLabel=ym=>{const [y,m]=ym.split("-");return `${MESES[+m-1]} ${y}`;};
const addMes=(ym,n)=>{let [y,m]=ym.split("-").map(Number);m+=n;while(m<1){m+=12;y--}while(m>12){m-=12;y++}return `${y}-${String(m).padStart(2,"0")}`;};
const fmtData=d=>d?d.split("-").reverse().join("/"):"";
const parseValor=s=>{s=String(s??"").trim().replace(/[R$\s]/g,"");if(s.includes(","))s=s.replace(/\./g,"").replace(",",".");const n=parseFloat(s);return isFinite(n)?Math.round(n*100)/100:NaN;};
const vTxt=v=>v?String(v).replace(".",","):"";
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};

const S={db:null,uid:null,ready:false,offline:false,lanc:[],contas:[],cartoes:[],hist:[],fech:[],
  mes:hoje().slice(0,7),tab:"rapido",rap:{txt:"",cat:"",meio:"",para:"",ultimo:null,busy:false},quem:"",edit:null,form:null,
  filtro:{q:"",cat:"",quem:"",status:"",meio:""},confirmDel:null,inline:null,abertos:new Set(),abaCartao:{}};

function toast(m){const t=document.getElementById("toast");t.textContent=m;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2600);}

/* meio de pagamento: valor "c:<id>" para cartão, ou o nome do outro meio */
const cartoesAtivos=()=>S.cartoes.filter(c=>c.ativo!==false).sort((a,b)=>(a.ordem||0)-(b.ordem||0)||a.nome.localeCompare(b.nome));
/* cartões contam por banco: físico e virtual do mesmo banco viram um só */
const cardDe=id=>S.cartoes.find(k=>k.id===id);
const bancoDe=x=>{const c=x&&x.cartaoId?cardDe(x.cartaoId):null;return c?(c.grupo||c.nome):"";};
const repCard=id=>{const c=cardDe(id);if(!c)return id;const g=grupos().find(x=>x.grupo===(c.grupo||c.nome));return g?g.cards[0].id:id;};
const meioKey=x=>x.cartaoId?("c:"+repCard(x.cartaoId)):(x.meio||x.forma||"");
const meioNome=x=>{if(x.cartaoId){const c=S.cartoes.find(k=>k.id===x.cartaoId);return c?(c.grupo||c.nome):"Cartão removido";}return x.meio||x.forma||"—";};
const aplicaMeio=(obj,key)=>{if(key&&key.startsWith("c:")){obj.cartaoId=key.slice(2);obj.meio="Cartão";}else{obj.cartaoId="";obj.meio=key||"";}return obj;};
const meioOptions=sel=>`${grupos().map(g=>`<option value="c:${g.cards[0].id}" ${sel==="c:"+g.cards[0].id?"selected":""}>💳 ${esc(g.grupo)}</option>`).join("")}${OUTROS.map(o=>`<option ${sel===o?"selected":""}>${o}</option>`).join("")}`;

const doMes=(ym=S.mes)=>S.lanc.filter(l=>!l.apagado&&l.mes===ym);
const soma=a=>Math.round(a.reduce((s,l)=>s+(Number(l.valor)||0),0)*100)/100;

function renderTop(){
  document.getElementById("mesLbl").textContent=mesLabel(S.mes);
  document.body.dataset.aba=S.tab;
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===({lancar:"painel",historico:"lista"}[S.tab]||S.tab)));
}

/* ---------- cartões agrupados por banco ---------- */
function grupos(){
  const g={};
  cartoesAtivos().forEach(c=>{const k=c.grupo||c.nome;(g[k]=g[k]||{grupo:k,cor:c.cor,venc:c.venc,ordem:c.ordem||0,cards:[]}).cards.push(c);});
  Object.values(g).forEach(x=>x.cards.sort((a,b)=>(a.tipo==="Físico"?0:1)-(b.tipo==="Físico"?0:1)));
  return Object.values(g);
}
const swatches=sel=>`<div class="swatches">${Object.keys(CORES).map(k=>`<button type="button" class="sw" data-cor="${k}" aria-pressed="${sel===k}" aria-label="Cor ${k}" style="background:${ccBg(k)}"></button>`).join("")}</div>`;

/* ---------- formulários embutidos no painel ---------- */
function camposConta(d){
  return `<div class="f wide"><label for="iNome">Nome</label><input id="iNome" value="${esc(d.nome)}" placeholder="${d.meio&&d.meio.startsWith("c:")?"Ex.: Netflix, Spotify, iFood":"Ex.: Condomínio (inclui água)"}"></div>
    <div class="f"><label for="iValor">Valor previsto (R$)</label><input id="iValor" inputmode="decimal" class="num" value="${esc(d.valor)}" placeholder="0,00"></div>
    <div class="f"><label for="iCat">Categoria</label><select id="iCat">${CATS.map(([k])=>`<option ${k===d.categoria?"selected":""}>${k}</option>`).join("")}</select></div>
    <div class="f"><label for="iMeio">Pago com</label><select id="iMeio">${meioOptions(d.meio)}</select></div>
    <div class="f"><label for="iDia">Vence dia</label><input id="iDia" type="number" min="1" max="31" value="${esc(d.dia||"")}" placeholder="opcional"></div>
    <label class="check" style="grid-column:1/-1"><input type="checkbox" id="iAuto" ${d.auto?"checked":""}> Débito automático (cai sozinho, sem precisar pagar)</label>`;
}
function confirma(act,id){
  return `<span class="confirma">Confirma?</span><button class="btn small danger" type="button" data-act="${act}" data-id="${esc(id||"")}">Sim</button><button class="btn small ghost" type="button" data-act="naoConfirma">Não</button>`;
}
function botoesInline(rem,conf){
  return `<div class="err" id="iErr" hidden></div><div class="actions">${conf||`<button class="btn small" type="submit">Salvar</button><button class="btn small ghost" type="button" data-act="fecharInline">Cancelar</button>${rem||""}`}</div>`;
}
function camposLinha(d){
  return `<div class="f wide"><label for="iNome">Nome da despesa</label><input id="iNome" value="${esc(d.nome)}" placeholder="Ex.: Diversos" autocomplete="off"></div>
    <div class="f"><label for="iCat">Categoria</label><select id="iCat">${CATS.map(([k])=>`<option ${k===d.categoria?"selected":""}>${k}</option>`).join("")}</select></div>`;
}
function inlineConta(c){
  return `<form class="inline" id="fInline" novalidate>${S.inline.draft.kind==="linha"?camposLinha(S.inline.draft):camposConta(S.inline.draft)}${botoesInline(c?`<button class="btn small danger" type="button" data-act="removerConta" data-id="${c.id}">Tirar da lista</button>`:"",c&&S.confirmDel===c.id?confirma("removerConta",c.id):"")}</form>`;
}
function inlineGrupo(){
  const d=S.inline.draft;
  return `<form class="inline" id="fInline" novalidate>
    <div class="f wide"><label for="kNome">Nome do cartão</label><input id="kNome" value="${esc(d.nome)}" placeholder="Ex.: BTG Mastercard"></div>
    <div class="f"><label for="kVenc">Fatura vence dia</label><input id="kVenc" type="number" min="1" max="31" value="${esc(d.venc||"")}" placeholder="opcional"></div>
    <div class="f" style="grid-column:1/-1"><span class="lab">Cor</span>${swatches(d.cor)}</div>
    ${botoesInline(S.inline.id!=="new"?`<button class="btn small danger" type="button" data-act="removerGrupo">Tirar cartão</button>`:"",S.confirmDel==="g:"+S.inline.id?confirma("removerGrupo"):"")}</form>`;
}
function inlineNovo(){
  const d=S.inline.draft;
  if(d.kind==="linha")return `<form class="inline" id="fInline" novalidate>${camposLinha(d)}${botoesInline("")}</form>`;
  return `<form class="inline" id="fInline" novalidate>
    <div class="f" style="grid-column:1/-1"><span class="lab">O que você quer adicionar?</span><div class="seg">
      <button type="button" data-kind="conta" aria-pressed="${d.kind==="conta"}">Conta ou despesa fixa</button>
      <button type="button" data-kind="cartao" aria-pressed="${d.kind==="cartao"}">Cartão</button></div></div>
    ${d.kind==="cartao"?`<div class="f wide"><label for="kNome">Nome do cartão</label><input id="kNome" value="${esc(d.nome)}" placeholder="Ex.: Nubank Mastercard"></div>
      <div class="f"><label for="kVenc">Fatura vence dia</label><input id="kVenc" type="number" min="1" max="31" value="${esc(d.venc||"")}" placeholder="opcional"></div>
      <div class="f" style="grid-column:1/-1"><span class="lab">Cor</span>${swatches(d.cor)}</div>`:camposConta(d)}
    ${botoesInline("")}</form>`;
}

/* ---------- painel ---------- */
function rowConta(c,itens){
  const IN=S.inline;
  if(IN&&IN.type==="conta"&&IN.id===c.id) return inlineConta(c);
  if(c.tipo==="linha"){const ls=itens.filter(x=>x.contaId===c.id);
    return `<div class="row"><span class="stripe" style="background:${catColor(c.categoria)}"></span>
    <div class="txt"><div class="t">${esc(c.nome)}</div><div class="s">${ls.length?`${ls.length} lançamento${ls.length===1?"":"s"} no mês`:"Nada lançado no mês"} · ${esc(c.categoria)}</div></div>
    <div class="right"><b class="num">${brl(soma(ls))}</b><button class="btn small" data-act="lancarConta" data-id="${c.id}">Lançar</button><button class="icon" data-act="editConta" data-id="${c.id}" aria-label="Alterar ${esc(c.nome)}">✎</button></div></div>`;}
  const l=itens.find(x=>x.contaId===c.id);
  const st=l?(l.status==="pago"?`<span class="pill ok">Pago</span>`:`<span class="pill warn">A pagar</span>`):"";
  const btn=l?(l.status==="pago"?"":`<button class="btn small ghost" data-act="pagar" data-id="${l.id}">Marcar pago</button>`):`<button class="btn small" data-act="lancarConta" data-id="${c.id}">Lançar</button>`;
  const meio=meioNome(c);
  return `<div class="row"><span class="stripe" style="background:${catColor(c.categoria)}"></span>
    <div class="txt"><div class="t">${esc(c.nome)}${l?"":` <span class="falta" title="Ainda não lançado no mês">*</span>`}${c.auto?` <span class="pill auto">Automático</span>`:""}</div><div class="s">${[c.dia?`Vence dia ${c.dia}`:"",meio,!l&&c.valor?`previsto ${brl(c.valor)}`:""].filter(Boolean).map(esc).join(" · ")||"&nbsp;"}</div></div>
    <div class="right"><b class="num">${brl(soma(itens.filter(x=>x.contaId===c.id)))}</b>${st}${btn}<button class="icon" data-act="editConta" data-id="${c.id}" aria-label="Alterar ${esc(c.nome)}">✎</button></div></div>`;
}
function rowCC(l){
  const IN=S.inline;
  if(l.contaId&&IN&&IN.type==="conta"&&IN.id===l.contaId){const c=S.contas.find(x=>x.id===l.contaId);if(c)return inlineConta(c);}
  return `<div class="row click tight" data-act="editar" data-id="${l.id}"><span class="stripe" style="background:${catColor(l.categoria)}"></span>
    <div class="txt"><div class="t">${esc(l.desc)}${l.auto?` <span class="pill auto">Automático</span>`:""}</div><div class="s">${fmtData(l.data).slice(0,5)} · ${esc(meioNome(l))} · ${esc(l.categoria)}</div></div>
    <div class="right"><b class="num">${brl(l.valor)}</b>${l.status==="pago"?`<span class="pill ok">Pago</span>`:`<span class="pill warn">A pagar</span>`}</div></div>`;
}
function blocoCartao(itens,contas){
  const gs=grupos(),aberto=S.abertos.has("cc"),IN=S.inline;
  const gastos=itens.filter(l=>l.cartaoId),fixos=contas.filter(c=>c.cartaoId).sort((a,b)=>(a.dia||40)-(b.dia||40)||a.nome.localeCompare(b.nome));
  const faltam=fixos.filter(c=>!itens.some(l=>l.contaId===c.id)).length;
  const cor=gs[0]?ccBg(gs[0].cor):"var(--line)",alvo=gs[0]?gs[0].cards[0].id:"";
  let sub="";
  if(aberto){
    sub=`<div class="sub"><div class="list">${fixos.map(c=>rowConta(c,itens)).join("")||`<div class="empty" style="padding:14px">Nenhum débito automático cadastrado.</div>`}
      ${IN&&IN.type==="conta"&&IN.id==="new"&&IN.ctx==="cc"?inlineConta(null):(alvo?`<button class="btn small ghost" data-act="novaAssinatura" data-id="${alvo}" style="justify-self:start">+ Débito automático</button>`:"")}</div></div>`;
  }
  return `<div class="group ${aberto?"open":""}">
    <div class="row grow" data-act="toggleGrupo" data-grupo="cc" role="button" tabindex="0" aria-expanded="${aberto}">
      <span class="stripe" style="background:${cor}"></span>
      <div class="txt"><div class="t">Cartão de crédito${faltam?` <span class="falta" title="Tem débito automático ainda não lançado">*</span>`:""}</div><div class="s">${fixos.length} automático${fixos.length===1?"":"s"} por mês</div></div>
      <div class="right"><b class="num">${brl(soma(gastos))}</b>${alvo?`<button class="btn small" data-act="gastoCartao" data-id="${alvo}">Lançar</button>`:""}<span class="chev" aria-hidden="true">${aberto?"▴":"▾"}</span></div>
    </div>${sub}</div>`;
}
function vPainel(){
  const itens=doMes(),total=soma(itens),pago=soma(itens.filter(l=>l.status==="pago")),falta=total-pago,ant=soma(doMes(addMes(S.mes,-1)));
  const dif=ant>0?Math.round((total-ant)/ant*100):null;
  const contas=S.contas.filter(c=>c.ativo!==false);
  const IN=S.inline;
  const entradas=contas.filter(c=>!c.cartaoId).map(c=>({k:c.nome,html:rowConta(c,itens)}))
    .concat(grupos().length||contas.some(c=>c.cartaoId)?[{k:"Cartão de crédito",html:blocoCartao(itens,contas)}]:[])
    .sort((a,b)=>a.k.localeCompare(b.k,"pt-BR"));

  const porCat={};itens.forEach(l=>porCat[l.categoria||"Outros"]=(porCat[l.categoria||"Outros"]||0)+Number(l.valor||0));
  const cats=Object.entries(porCat).sort((a,b)=>b[1]-a[1]);
  const meses=[...Array(6)].map((_,i)=>addMes(S.mes,i-5)),tots=meses.map(m=>soma(doMes(m))),max=Math.max(...tots,1);
  let donut="";
  if(total>0){let acc=0;const C=2*Math.PI*62;
    donut=`<svg viewBox="0 0 160 160" width="170" height="170" role="img" aria-label="Gastos por categoria"><circle cx="80" cy="80" r="62" fill="none" stroke="var(--surface2)" stroke-width="22"/>
      ${cats.map(([c,v])=>{const len=v/total*C;const s=`<circle cx="80" cy="80" r="62" fill="none" stroke="${catColor(c)}" stroke-width="22" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-acc}" transform="rotate(-90 80 80)"/>`;acc+=len;return s;}).join("")}
      <text x="80" y="76" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="Figtree,sans-serif">total</text>
      <text x="80" y="95" text-anchor="middle" font-size="15" font-weight="800" fill="var(--ink)" font-family="Figtree,sans-serif">${esc(brl(total).replace(",00",""))}</text></svg>`;}

  return `${S.offline?`<div class="banner">${S.semConfig?"Falta configurar o Firebase neste arquivo.":"Sem conexão com o banco de dados. Confira a internet."}</div>`:""}
  <section class="kpis">
    <div class="kpi k1"><span class="lbl">Total do mês</span><span class="val num">${brl(total)}</span><span class="sub">${itens.length} lançamento${itens.length===1?"":"s"}</span></div>
    <div class="kpi k2"><span class="lbl">Já pago</span><span class="val num">${brl(pago)}</span><span class="sub">${total?Math.round(pago/total*100):0}% do total</span></div>
    <div class="kpi k3"><span class="lbl">Falta pagar</span><span class="val num">${brl(falta)}</span><span class="sub">${itens.filter(l=>l.status!=="pago").length} em aberto</span></div>
    <div class="kpi k4"><span class="lbl">Mês anterior</span><span class="val num">${brl(ant)}</span><span class="sub">${dif===null?"sem dados para comparar":(dif>0?`▲ ${dif}% a mais agora`:dif<0?`▼ ${-dif}% a menos agora`:"igual ao mês passado")}</span></div>
  </section>
  <section class="card">

/* ---------- lançamento rápido: "gás 100" vira uma despesa paga hoje no Pix ---------- */
const norm=s=>String(s??"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim();
const DIC=[
  ["Contas da casa",["gas","botijao","luz","energia","ceee","equatorial","agua","dmae","corsan","internet","wifi","net","vivo","claro","tim","oi","telefone","celular","recarga"]],
  ["Moradia",["aluguel","condominio","faxina","diarista","limpeza","reforma","manutencao","conserto","eletricista","encanador","pintor","moveis","movel","jardineiro","chaveiro"]],
  ["Mercado",["mercado","supermercado","zaffari","bourbon","nacional","carrefour","atacadao","assai","big","walmart","padaria","pao","acougue","feira","hortifruti","fruteira","sacolao","verdura","frutas","carne"]],
  ["Delivery",["ifood","rappi","delivery","pizza","lanche","hamburguer","tele","tele-entrega","marmita"]],
  ["Transporte",["gasolina","combustivel","etanol","alcool","diesel","posto","uber","99","taxi","onibus","passagem","tri","trensurb","estacionamento","pedagio","oficina","mecanico","pneu","lavagem","lava-jato"]],
  ["Saúde",["farmacia","remedio","remedios","medico","medica","consulta","exame","exames","dentista","unimed","panvel","drogaria","raia","hospital","psicologo","psicologa","fisioterapia","otica","oculos","academia","plano de saude"]],
  ["Educação",["escola","colegio","faculdade","curso","livro","livros","apostila","mensalidade","uniforme","material escolar","papelaria","ingles"]],
  ["Lazer",["cinema","restaurante","bar","cafe","sorvete","passeio","viagem","hotel","show","festa","presente","parque","teatro","jogo","churrasco"]],
  ["Assinaturas",["netflix","spotify","prime","amazon prime","disney","youtube","globoplay","hbo","max","deezer","icloud","google one","assinatura"]],
  ["Impostos",["iptu","ipva","imposto","taxa","licenciamento","multa","detran","darf"]]
];
const MEIOS_TXT={pix:"Pix",dinheiro:"Dinheiro",especie:"Dinheiro",boleto:"Boleto",transferencia:"Transferência",ted:"Transferência",doc:"Transferência"};
const FILLER=["no","na","com","pelo","pela","em","de","do","da","cartao","reais","real","r$","$","rs","paguei","pago","foi"];
const dataOff=n=>{const d=new Date();d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;};
const dataTxt=d=>d===hoje()?`hoje, ${fmtData(d).slice(0,5)}`:d===dataOff(-1)?`ontem, ${fmtData(d).slice(0,5)}`:fmtData(d);
const recentes=()=>S.lanc.filter(l=>!l.apagado&&l.desc).sort((a,b)=>(b.criadoEm||b.data||"").localeCompare(a.criadoEm||a.data||""));

function categoriaDe(desc){
  const d=norm(desc);if(!d)return {cat:""};
  const ex=recentes().find(l=>norm(l.desc)===d);
  if(ex&&ex.categoria)return {cat:ex.categoria,fonte:"já usada antes"};
  const ativos=S.contas.filter(c=>c.ativo!==false&&c.nome);
  const conta=ativos.find(c=>norm(c.nome)===d)||(d.length>=3?ativos.find(c=>{const n=norm(c.nome);return n.length>=3&&(` ${d} `.includes(` ${n} `)||` ${n} `.includes(` ${d} `));}):null);
  if(conta&&conta.categoria)return {cat:conta.categoria,conta,fonte:"item da lista"};
  const sp=` ${d.replace(/[^\w$ -]/g," ")} `;
  for(const [cat,ws] of DIC)if(ws.some(w=>sp.includes(` ${w} `)))return {cat,fonte:"reconhecida"};
  const w0=d.split(/\s+/)[0];
  const p=w0.length>=3&&recentes().find(l=>norm(l.desc).split(/\s+/)[0]===w0);
  if(p&&p.categoria)return {cat:p.categoria,fonte:"parecida com antes"};
  return {cat:""};
}

function lerRapido(txt){
  const toks=String(txt||"").trim().split(/\s+/).filter(Boolean);
  let valor=NaN,valorForte=false,meio="",grupo=null,tipo="",data=hoje(),pend$=false;const desc=[];
  const gs=grupos();
  toks.forEach(t=>{
    const n=norm(t).replace(/[!?;:]+$/,"");
    if(n==="$"||n==="r$"||n==="rs"){pend$=true;return;}
    const m=n.match(/^(?:r?\$)?(\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?|\d+(?:[.,]\d{1,2})?)(?:,-|reais)?$/);
    if(m&&!(n==="99"&&!pend$&&!/\$/.test(n)&&desc.length===0&&toks.length>1)){
      const forte=pend$||/\$/.test(n);
      let s=m[1];if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,"");
      const v=parseValor(s);
      if(v>0&&(forte||!valorForte)){valor=v;valorForte=forte;}
      pend$=false;return;
    }
    pend$=false;
    const dm=n.match(/^(\d{1,2})\/(\d{1,2})$/);
    if(dm&&+dm[1]<=31&&+dm[2]<=12){data=`${hoje().slice(0,4)}-${dm[2].padStart(2,"0")}-${dm[1].padStart(2,"0")}`;return;}
    if(n==="hoje"){data=hoje();return;}
    if(n==="ontem"){data=dataOff(-1);return;}
    if(n==="anteontem"){data=dataOff(-2);return;}
    if(MEIOS_TXT[n]){meio=MEIOS_TXT[n];return;}
    if(n==="fisico"||n==="virtual"||n==="credito")return;
    const g=gs.find(g=>{const gn=norm(g.grupo);return gn===n||gn.split(/\s+/)[0]===n;});
    if(g&&n.length>=3){grupo=g;return;}
    if(n==="cartao")return;
    desc.push(t);
  });
  while(desc.length&&FILLER.includes(norm(desc[desc.length-1])))desc.pop();
  while(desc.length&&FILLER.includes(norm(desc[0])))desc.shift();
  let d=desc.join(" ");d=d.charAt(0).toUpperCase()+d.slice(1);
  if(grupo)meio="c:"+grupo.cards[0].id;
  const meioDigitado=!!meio;
  const ct=categoriaDe(d);
  if(!meio&&ct.conta&&ct.conta.tipo!=="linha")meio=meioKey(ct.conta);
  if(!meio)meio="Pix";
  let contaId="";
  const linha=S.contas.find(c=>c.ativo!==false&&c.tipo==="linha"&&norm(c.nome)===norm(d));
  if(linha)contaId=linha.id;
  else if(ct.conta){const ja=S.lanc.some(l=>!l.apagado&&l.contaId===ct.conta.id&&l.mes===data.slice(0,7));if(!ja)contaId=ct.conta.id;}
  let cat=ct.cat,fonte=ct.fonte||"";
  if(S.rap.para&&S.rap.para===norm(d)){if(S.rap.cat){cat=S.rap.cat;fonte="";}if(S.rap.meio)meio=S.rap.meio;}
  return {desc:d,valor,meio,meioDigitado,data,cat,fonte,contaId};
}

async function salvarRapido(){
  const R=S.rap;if(R.busy||S.offline)return;
  const p=lerRapido(R.txt);
  if(!p.desc||!(p.valor>0)||!p.cat){updPrev();document.getElementById("rTxt")?.focus();if(p.desc&&p.valor>0&&!p.cat)document.getElementById("rCat")?.focus();return;}
  R.busy=true;
  const agora=new Date().toISOString();
  const dados=aplicaMeio({desc:p.desc,valor:p.valor,data:p.data,mes:p.data.slice(0,7),categoria:p.cat,auto:false,status:"pago",obs:"",contaId:p.contaId,alteradoEm:agora,alteradoPor:S.quem,quem:S.quem,autor:S.uid||"",criadoEm:agora,apagado:false,origem:"rapido"},p.meio);
  try{
    const r=await S.db.collection("lancamentos").add(dados);
    await registrar("lançou",`"${dados.desc}" de ${brl(dados.valor)}`,`${meioNome(dados)} · ${dados.categoria} · lançamento rápido`,r.id);
    S.rap={txt:"",cat:"",meio:"",para:"",busy:false,ultimo:{id:r.id,desc:dados.desc,valor:dados.valor,categoria:dados.categoria,meioNome:meioNome(dados)}};
    render();toast("Despesa lançada");
  }catch(e){R.busy=false;erroGravar(e)}
}

function render(fromData){
  renderTop();

  if(fromData&&S.ready&&(S.tab==="lancar"||(S.tab==="painel"&&S.inline)))return; // não apaga o que está sendo digitado
  if(S.tab!=="lancar"&&!S.inline)S.confirmDel=null;
  const m=document.getElementById("main");
  m.innerHTML=S.tab==="rapido"?vRapido():S.tab==="painel"?vPainel():S.tab==="lancar"?vLancar():S.tab==="lista"||S.tab==="historico"?vLista()+vHist():vSalvar();

  if(S.tab==="rapido"){updRapido();const i=document.getElementById("rTxt");if(i&&!matchMedia("(hover:none)").matches){i.focus({preventScroll:true});i.setSelectionRange(i.value.length,i.value.length);}}
}

function erroGravar(e){
  if(e&&e.code==="quota_exceeded")toast("O espaço de dados acabou. Avise o responsável pela planilha.");
  else if(e&&/permission|PERMISSION/.test(String(e.code||e.message||"")))toast("O Firebase recusou a gravação. Confira as Regras do banco.");
  else toast("Não deu para salvar agora. Tente de novo.");

function precisaQuem(){return true;}

async function salvarLanc(){
  lerForm();const f=S.form,err=document.getElementById("fErr"),v=parseValor(f.valor),msgs=[];
  if(!f.desc.trim())msgs.push("Diga o que foi a despesa.");
  if(!(v>0))msgs.push("Digite um valor maior que zero.");
  if(!f.data)msgs.push("Escolha a data.");
  if(!f.meio)msgs.push("Escolha com o que foi pago.");
  if(msgs.length){err.textContent=msgs.join(" ");err.hidden=false;return;}
  const dados=aplicaMeio({desc:f.desc.trim(),valor:v,data:f.data,mes:f.data.slice(0,7),categoria:f.categoria,auto:!!f.auto,status:f.status,obs:f.obs.trim(),contaId:f.contaId||"",alteradoEm:new Date().toISOString(),alteradoPor:S.quem},f.meio);
  try{
    if(S.edit){
      const a=S.lanc.find(l=>l.id===S.edit)||{},mud=[];
      if(a.valor!==dados.valor)mud.push(`valor ${brl(a.valor)} → ${brl(dados.valor)}`);
      if(a.desc!==dados.desc)mud.push(`nome "${a.desc}" → "${dados.desc}"`);
      if(a.status!==dados.status)mud.push(`situação → ${dados.status}`);
      if(a.data!==dados.data)mud.push(`data → ${fmtData(dados.data)}`);
      if(meioKey(a)!==meioKey(dados))mud.push(`pago com → ${meioNome(dados)}`);
      await S.db.doc("lancamentos/"+S.edit).update(dados);
      await registrar("alterou",`"${dados.desc}"`,mud.join(" · "),S.edit);toast("Alteração salva");
    }else{
      Object.assign(dados,{quem:S.quem,autor:S.uid||"",criadoEm:dados.alteradoEm,apagado:false});
      const r=await S.db.collection("lancamentos").add(dados);
      await registrar("lançou",`"${dados.desc}" de ${brl(v)}`,`${meioNome(dados)}${dados.auto?" (automático)":""} · ${dados.categoria}`,r.id);toast("Despesa lançada");
    }
    if(dados.mes!==S.mes)S.mes=dados.mes;
    S.edit=null;S.form=null;S.tab="painel";render();
  }catch(e){erroGravar(e)}
}
async function salvarInline(){
  lerInline();const IN=S.inline,d=IN.draft,err=document.getElementById("iErr");
  if(!precisaQuem(err))return;
  if(!String(d.nome||"").trim()){err.textContent="Dê um nome.";err.hidden=false;return;}
  const venc=parseInt(d.venc)||null,vencOk=venc&&venc<=31?venc:null;
  try{
    if(d.kind==="linha"){
      const nome=d.nome.trim();
      if(IN.id==="new"&&S.contas.some(c=>c.ativo!==false&&norm(c.nome)===norm(nome))){err.textContent="Já existe uma linha com esse nome.";err.hidden=false;return;}
      if(IN.id==="new"){const r=await S.db.collection("contas").add({nome,categoria:d.categoria,tipo:"linha",valor:0,dia:null,auto:false,ativo:true,cartaoId:"",meio:"",forma:"",detalhe:""});await registrar("criou a linha",`"${nome}"`,d.categoria,r.id);}
      else{await S.db.doc("contas/"+IN.id).update({nome,categoria:d.categoria});await registrar("alterou a linha",`"${nome}"`,d.categoria,IN.id);}
    }else if(IN.type==="conta"||(IN.type==="novo"&&d.kind==="conta")){
      const valor=String(d.valor||"").trim()?parseValor(d.valor):0;
      if(!(valor>=0)){err.textContent="Valor inválido.";err.hidden=false;return;}
      const dia=parseInt(d.dia)||null;
      const dados=aplicaMeio({nome:d.nome.trim(),categoria:d.categoria,valor,dia:dia&&dia<=31?dia:null,auto:!!d.auto,ativo:true,forma:"",detalhe:""},d.meio);
      if(IN.type==="novo"||IN.id==="new"){const r=await S.db.collection("contas").add(dados);await registrar("criou o item",`"${dados.nome}"`,meioNome(dados),r.id);
        if(dados.cartaoId)S.abertos.add("cc");}
      else{await S.db.doc("contas/"+IN.id).update(dados);await registrar("alterou o item",`"${dados.nome}"`,`${meioNome(dados)}${dados.auto?" · automático":""}${valor?" · ~"+brl(valor):""}`,IN.id);}
    }else if(IN.type==="novo"&&d.kind==="cartao"){
      const nome=d.nome.trim();if(grupos().some(g=>g.grupo.toLowerCase()===nome.toLowerCase())){err.textContent="Já existe um cartão com esse nome.";err.hidden=false;return;}
      const ordem=cartoesAtivos().length+1,base=nome.normalize("NFD").replace(/[^\w]+/g,"-").toLowerCase().slice(0,40)+"-"+Date.now().toString(36);
      await S.db.doc("cartoes/"+base).set({nome,grupo:nome,tipo:"",cor:d.cor||"roxo",venc:vencOk,ordem,ativo:true});
      await registrar("adicionou o cartão",`"${nome}"`,"","");S.abertos.add("cc");
    }else if(IN.type==="grupo"){
      const g=grupos().find(x=>x.grupo===IN.id),nome=d.nome.trim();
      for(const c of g.cards) await S.db.doc("cartoes/"+c.id).update({nome:c.tipo?`${nome} ${c.tipo}`:nome,grupo:nome,cor:d.cor||"preto",venc:vencOk});
      await registrar("alterou o cartão",`"${nome}"`,"","");
      if(S.banco===IN.id)S.banco=nome;
    }
    S.inline=null;S.confirmDel=null;render();toast("Salvo");
  }catch(e){erroGravar(e)}
}
/* ---------- exportação ---------- */
function carregar(src){return new Promise((ok,no)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=()=>no(new Error("load"));document.head.appendChild(s);});}
async function baixar(nome,dados){
  try{
    const tipo=nome.endsWith(".csv")?"text/csv;charset=utf-8":nome.endsWith(".pdf")?"application/pdf":"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
    const blob=dados instanceof Blob?new Blob([dados],{type:tipo}):new Blob([dados],{type:tipo});
    const u=URL.createObjectURL(blob),a=document.createElement("a");
    a.href=u;a.download=nome;a.rel="noopener";document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),10000);toast("Arquivo pronto");
  }catch(e){toast("Não foi possível baixar.");}
}
const ordData=a=>a.sort((x,y)=>(x.data||"").localeCompare(y.data||""));
const mesDe=l=>l.mes||(l.data||"").slice(0,7);
function linhasMes(){return ordData(doMes()).map(l=>({"Data":fmtData(l.data),"Descrição":l.desc,"Pago com":meioNome(l),"Automático":l.auto?"Sim":"Não","Categoria":l.categoria,"Valor (R$)":Number(l.valor),"Situação":l.status==="pago"?"Pago":"A pagar","Observação":l.obs||""}));}
function porMeio(it){const r={};it.forEach(l=>{const k=meioNome(l);r[k]=(r[k]||0)+Number(l.valor);});return Object.entries(r).sort((a,b)=>b[1]-a[1]);}
function porCatE(it){const r={};it.forEach(l=>r[l.categoria]=(r[l.categoria]||0)+Number(l.valor));return Object.entries(r).sort((a,b)=>b[1]-a[1]);}
async function exportXlsx(){
  try{if(!window.XLSX)await carregar("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js");}catch(e){toast("Não carregou o gerador de Excel. Tente o CSV.");return;}
  const X=window.XLSX,wb=X.utils.book_new(),todos=ordData(S.lanc.filter(l=>!l.apagado&&l.data));
  if(!todos.length){toast("Ainda não há lançamentos para salvar.");return;}
  const dt=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d,12);};
  const r2=v=>Math.round(v*100)/100;
  const folha=(rows,header,larg,moeda)=>{const ws=X.utils.json_to_sheet(rows,{header,cellDates:true,dateNF:"dd/mm/yyyy"});
    const rg=X.utils.decode_range(ws["!ref"]);
    header.forEach((hd,ci)=>{if(!moeda.includes(hd))return;for(let r=1;r<=rg.e.r;r++){const cel=ws[X.utils.encode_cell({r,c:ci})];if(cel&&typeof cel.v==="number")cel.z="#,##0.00";}});
    ws["!autofilter"]={ref:ws["!ref"]};ws["!cols"]=larg.map(w=>({wch:w}));return ws;};
  const H1=["Mês","Data","Descrição","Pago com","Automático","Categoria","Valor (R$)","Situação","Observação"];
  const rows=todos.map(l=>({"Mês":mesLabel(mesDe(l)),"Data":dt(l.data),"Descrição":l.desc,"Pago com":meioNome(l),"Automático":l.auto?"Sim":"Não","Categoria":l.categoria||"Outros","Valor (R$)":Number(l.valor)||0,"Situação":l.status==="pago"?"Pago":"A pagar","Observação":l.obs||""}));
  X.utils.book_append_sheet(wb,folha(rows,H1,[15,11,30,18,11,16,12,10,28],["Valor (R$)"]),"Lançamentos");
  const ms=[...new Set(todos.map(mesDe))].sort(),catsUsadas=CATS.map(c=>c[0]).filter(c=>todos.some(l=>(l.categoria||"Outros")===c));
  const H2=["Mês","Total (R$)","Já pago (R$)","A pagar (R$)","Lançamentos",...catsUsadas];
  const res=ms.map(m=>{const it=todos.filter(l=>mesDe(l)===m),o={"Mês":mesLabel(m),"Total (R$)":soma(it),"Já pago (R$)":soma(it.filter(l=>l.status==="pago")),"A pagar (R$)":soma(it.filter(l=>l.status!=="pago")),"Lançamentos":it.length};
    catsUsadas.forEach(c=>o[c]=soma(it.filter(l=>(l.categoria||"Outros")===c)));return o;});
  X.utils.book_append_sheet(wb,folha(res,H2,[15,12,12,12,11,...catsUsadas.map(()=>14)],["Total (R$)","Já pago (R$)","A pagar (R$)",...catsUsadas]),"Resumo por mês");
  const H3=["Mês","Pago com","Total (R$)","Lançamentos"],pm=[];
  ms.forEach(m=>{const it=todos.filter(l=>mesDe(l)===m),g={};it.forEach(l=>{const k=meioNome(l);(g[k]=g[k]||[]).push(l);});
    Object.entries(g).sort((a,b)=>soma(b[1])-soma(a[1])).forEach(([k,v])=>pm.push({"Mês":mesLabel(m),"Pago com":k,"Total (R$)":soma(v),"Lançamentos":v.length}));});
  X.utils.book_append_sheet(wb,folha(pm,H3,[15,22,12,11],["Total (R$)"]),"Por cartão e meio");
  const H4=["Item","Categoria","Valor previsto (R$)","Vence dia","Pago com","Automático"];
  const fx=S.contas.filter(c=>c.ativo!==false).map(c=>({"Item":c.nome,"Categoria":c.categoria,"Valor previsto (R$)":c.valor?r2(Number(c.valor)):"","Vence dia":c.dia||"","Pago com":meioNome(c),"Automático":c.auto?"Sim":"Não"}));
  X.utils.book_append_sheet(wb,folha(fx.length?fx:[{"Item":"Nenhum item fixo"}],H4,[28,16,16,10,22,11],["Valor previsto (R$)"]),"Itens fixos");
  await baixar(`Despesas da Casa até ${mesLabel(ms[ms.length-1])}.xlsx`,new Blob([X.write(wb,{bookType:"xlsx",type:"array"})]));
}

/* banco: Realtime Database com o mesmo jeito de usar do painel (coleções e documentos) */
function rtdb(fdb){
  const root=fdb.ref("despesas"),limpa=o=>JSON.parse(JSON.stringify(o));
  const snapOf=s=>{const v=s.val()||{};return {docs:Object.keys(v).map(k=>({id:k,data:()=>v[k]}))};};
  const doc=path=>{const ref=root.child(path);return {set:d=>ref.set(limpa(d)),update:d=>ref.update(limpa(d)),delete:()=>ref.remove(),
    get:async()=>{const s=await ref.once("value");return {id:s.key,exists:s.exists(),data:()=>s.val()};}};};
  const collection=name=>{const ref=root.child(name);const q={orderBy:()=>q,limit:()=>q,
    onSnapshot:(ok,err)=>{ref.on("value",s=>ok(snapOf(s)),e=>err&&err(e));},
    get:async()=>snapOf(await ref.once("value")),
    add:async d=>{const r=ref.push();await r.set(limpa(d));return {id:r.key};},
    doc:id=>doc(name+"/"+id)};return q;};
  return {collection,doc};
}

const ITENS_INICIAIS=[
  ["celular","Celulares","Contas da casa","Boleto",""],["combustivel","Combustível","Transporte","Vários",""],

  ["streaming","Streaming (filmes e música)","Assinaturas","Cartão","btg"]];
async function semearContas(db){
  try{
    const m=await db.doc("config/itensIniciais").get();if(m.exists)return;
    for(const [id,nome,categoria,meio,cartaoId] of ITENS_INICIAIS){
      if(S.contas.some(c=>c.id===id))continue;
      await db.doc("contas/"+id).set({nome,categoria,meio,cartaoId,auto:!!cartaoId,valor:0,ativo:true});
    }
    await db.doc("config/itensIniciais").set({em:new Date().toISOString()});
  }catch(e){}
}
function iniciar(u){
  if(S.db)return;
  const db=rtdb(firebase.database());S.db=db;S.uid=u.uid;
  let pend=4;const pronto=()=>{if(--pend<=0)S.ready=true;render();};
  const sub=(key,q,depois)=>{let first=true;q.onSnapshot(s=>{S[key]=s.docs.map(d=>({id:d.id,...d.data()}));if(first){first=false;depois&&depois();pronto();}else render(true);},()=>{if(first){first=false;pronto();}});};
  sub("lanc",db.collection("lancamentos"));sub("contas",db.collection("contas"),()=>semearContas(db));sub("fech",db.collection("fechamentos"));
  sub("cartoes",db.collection("cartoes"),()=>{if(!S.cartoes.length){
    db.doc("cartoes/btg").set({nome:"BTG Mastercard",grupo:"BTG Mastercard",tipo:"",cor:"btg",ordem:1,ativo:true});
    db.doc("cartoes/santander").set({nome:"Santander Visa",grupo:"Santander Visa",tipo:"",cor:"santander",ordem:2,ativo:true});}});
  firebase.database().ref(".info/connected").on("value",s=>{const off=s.val()===false&&S.ready;if(off!==S.offline){S.offline=off;render(true);}});
}
render();
(function(){
  if(!FIREBASE_CONFIG||!window.firebase){S.offline=true;S.semConfig=!FIREBASE_CONFIG;render();return;}
  firebase.initializeApp(FIREBASE_CONFIG);
  iniciar({uid:""});
})();

/* aviso de nova versão (Service Worker) */
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").then(reg=>{
    const avisa=w=>{if(!w)return;const show=()=>{document.getElementById("upd").hidden=false;document.getElementById("updBtn").onclick=()=>w.postMessage("skip");};
      if(w.state==="installed")show();else w.addEventListener("statechange",()=>{if(w.state==="installed")show();});};
    if(reg.waiting&&navigator.serviceWorker.controller)avisa(reg.waiting);
    reg.addEventListener("updatefound",()=>{if(navigator.serviceWorker.controller)avisa(reg.installing);});
    setInterval(()=>reg.update().catch(()=>{}),60000);
    document.addEventListener("visibilitychange",()=>{if(!document.hidden)reg.update().catch(()=>{});});
  }).catch(()=>{});
  let recarregou=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(recarregou)return;recarregou=true;location.reload();});
}
